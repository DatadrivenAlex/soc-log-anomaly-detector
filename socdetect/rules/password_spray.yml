title: Password spraying
id: password-spray
status: experimental
author: Alexandru Cojocari
description: >
  One source address fails authentication against many accounts, with only a
  few tries each. Spraying stays under a per-account lockout and still tests
  a common password.
level: high
base_score: 70
mitre:
  technique: T1110.003
  technique_name: Password Spraying
  tactic: Credential Access
tags:
  - attack.credential_access
  - attack.t1110.003
falsepositives:
  - A jump host where many users mistype a password once
  - Directory-join or monitoring checks that probe a user list
recommendation: >
  Compare the account list with a known jump box or vulnerability scanner.
  If the source is not approved, block it at the edge and reset any account
  that authenticated successfully from it afterward.
logsource:
  category: authentication
detection:
  selection:
    event_type:
      - ssh_auth
      - windows_logon
    outcome: failure
  threshold:
    group_by:
      - src_ip
    window: 15m
    min_count: 6
    distinct_field: user
    distinct_min: 6
    max_per_distinct: 3
    include_later_success: true
