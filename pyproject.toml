[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "socdetect"
version = "0.1.0"
description = "SOC Tier-1 log triage for SSH, web access, and Windows logon events."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Alexandru Cojocari" }]
keywords = ["soc", "detection", "sigma", "mitre-attack", "log-analysis"]
dependencies = [
  "fastapi>=0.115",
  "numpy>=1.26",
  "pyyaml>=6.0",
  "scikit-learn>=1.5",
  "typer>=0.12",
  "uvicorn>=0.32",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27",
  "pytest>=8.0",
  "ruff>=0.7",
]

[project.scripts]
socdetect = "socdetect.cli:app"

[tool.setuptools.packages.find]
include = ["socdetect*"]

[tool.setuptools.package-data]
socdetect = ["rules/*.yml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
filterwarnings = [
  "ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["socdetect", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"socdetect/cli.py" = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["socdetect"]
